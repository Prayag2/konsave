---
# This is the configuration file for konsave.
# Please make sure it follows the correct format for proper working of konsave.
# The format should be:
# ---
# save:
#     name:
#         location: "path/to/parent/directory"
#         entries:
#         # these are files which will be backed up. They should be present in the specified location.
#             - file1
#             - file2
# export:
#     # This includes files which will be exported with your profile.
#     # They will not be saved but only be exported and imported.
#     # These may include files like complete icon packs and themes..
#     name:
#         location: "path/to/parent/directory"
#         entries:
#             - file1
#             - file2
# ...
# You can use these variables and functions in the locations of different entries:
# $HOME: the home directory
# $PROFILES_DIR: directory where all profiles are saved
# $CONFIG_DIR: refers to "$HOME/.config/"
# $KONSAVE_DIR: the location where all Konsave files are stored ("$CONFIG_DIR/konsave").
# ${ENDS_WITH="text"}: for folders with different names on different computers but their names end with the same thing.
# The best example for this is the ".default-release" folder for firefox.
# ${BEGINS_WITH="text"}: for folders with different names on different computers but their names start with the same thing.

# The following files will be saved in your profiles
save:
    configs:
        location: "$CONFIG_DIR"
        entries:
            - gtk-2.0
            - gtk-3.0
            - gtk-4.0
            - Kvantum

    # Shell startup files and prompt configuration.
    shell:
        location: "$HOME/"
        entries:
            - .bashrc
            - .bash_profile
            - .bash_logout
            - .profile
            - .zshrc
            - .zshenv
            - .zprofile
            - .zlogin
            - .config/starship.toml
            - .config/fish

    # Terminal emulator profiles and colours.
    terminals:
        location: "$CONFIG_DIR"
        entries:
            - alacritty
            - kitty
            - wezterm
            - foot
            - ghostty
            - xfce4/terminal

    # Version control and developer tooling.
    dev_tools:
        location: "$CONFIG_DIR"
        entries:
            - git
            - gh
            - glab
            - nvim
            - helix
            - micro
            - bat
            - ripgrep
            - fd
            - lazygit

    # Command-line utility preferences.
    cli_tools:
        location: "$CONFIG_DIR"
        entries:
            - htop
            - btop
            - tmux
            - starship.toml
            - dconf

    # Tabby terminal settings. "traversal: files" only picks up the top-level
    # config files (config.yaml, window.json, …) and skips Electron caches.
    tabby:
        location: "$CONFIG_DIR/tabby"
        traversal: files
        exclude:
            - DIPS*
            - "Network Persistent State"
            - Preferences
            - "Trust Tokens*"
            - SharedStorage*
            - "Local State"
            - log.txt
            - "*.log"

    # SSH is available but unchecked by default so private keys are never
    # exported accidentally. Add finer-grained entries like ".ssh/config"
    # or ".ssh/known_hosts" to share only specific files.
    ssh:
        location: "$HOME/"
        entries:
            - .ssh

    # Here are a few examples of how you can add more stuff to back up
    # firefox:
    #     location: "$HOME/.mozilla/firefox/${ENDS_WITH='.default-release'}"
    #     entries:
    #         - chrome # for firefox customizations

    # oss:
    #     location: "$CONFIG_DIR/Code - OSS/User/"
    #     entries:
    #         - settings.json


# The following files will only be used for exporting and importing.
export:
    share_folder:
        location: "$HOME/.local/share"
        entries:
            - fonts
            - icons
            - themes
            - color-schemes
            - wallpapers

    home_folder:
        location: "$HOME/"
        entries:
            - .fonts
            - .themes
            - .icons

    # You can add more files to export like this
    # name:
    #     location: "path/to/parent/directory"
    #     entries:
    #         - file1
    #         - file2
    #         - folder1
    #         - folder2
...
