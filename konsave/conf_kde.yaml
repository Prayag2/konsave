---
# This is the configuration file for konsave.
# This file is pre-configured for KDE Plasma users.
# This will backup all the important files for your Plasma customizations.
# Please make sure it follows the correct format for proper working of Konsave.
# The format should be:
# ---
# save:
#     name:
#         location: "path/to/parent/directory"
#         entries:
#         # these are files which will be backed up.
#         # They should be present in the specified location.
#             - file1
#             - file2
# export:
#     # This includes files which will be exported with your profile.
#     # They will not be saved but only be exported and imported.
#     # These may include files like complete icon packs and themes..
#     name:
#         location: "path/to/parent/directory"
#         entries:
#             - file1
#             - file2
# ...
# You can use these placeholders in the "location" of each item:
# $HOME: the home directory
# $CONFIG_DIR: refers to "$HOME/.config/"
# $SHARE_DIR: refers to "$HOME/.local/share"
# $BIN_DIR: refers to "$HOME/.local/bin"
# ${ENDS_WITH="text"}: for folders with different names on different computers whose names end with the same thing.
# The best example for this is the "*.default-release" folder of firefox.
# ${BEGINS_WITH="text"}: for folders with different names on different computers whose names start with the same thing.

save:
    # Desktop look and feel, Plasma session, window rules and activities.
    configs:
        location: "$CONFIG_DIR"
        entries:
            - gtk-2.0
            - gtk-3.0
            - gtk-4.0
            - kate
            - Kvantum
            - latte
            - dolphinrc
            - katerc
            - konsolerc
            - kcminputrc
            - kdeglobals
            - kglobalshortcutsrc
            - klipperrc
            - krunnerrc
            - kscreenlockerrc
            - ksmserverrc
            - kwinrc
            - kwinrulesrc
            - plasma-org.kde.plasma.desktop-appletsrc
            - plasmarc
            - plasmashellrc
            - gtkrc
            - gtkrc-2.0
            - lattedockrc
            - breezerc
            - oxygenrc
            - lightlyrc
            - ksplashrc
            - khotkeysrc
            # Plasma 6.x compatibility (optional/extra configs)
            - systemsettingsrc
            - kded5rc               # renamed from kdedrc (Plasma 6)
            - kconf_updaterc
            - kscreenrc             # display layout; include if persistent on your system
            - plasma-systemmonitorrc
            - spectaclerc
            - plasmanotifyrc
            - plasma-localerc
            - plasma_calendar_holiday_regions
            - xdg-desktop-portal-kderc
            - kwinoutputconfig.json # per-output display settings
            # KDE Activities
            - kactivitymanagerdrc
            - kactivitymanagerd-statsrc
            - kactivitymanagerd-pluginsrc
            # Power management profiles
            - powermanagementprofilesrc
            - powerdevilrc

    app_layouts:
        location: "$HOME/.local/share/kxmlgui5"
        entries:
            - dolphin
            - konsole
            - yakuakerc
            # Optional application GUI layout overrides (add if present)
            - systemsettings
            - spectacle
            - plasma-systemmonitor

    # Autostart user .desktop entries (do NOT include distro defaults)
    autostart:
        location: "$CONFIG_DIR/autostart"
        entries:

    # Shell, terminal, developer tooling and CLI groups. These work on
    # desktops, laptops and headless servers alike.
    shell:
        location: "$HOME/"
        entries:
            - .bashrc
            - .bash_profile
            - .bash_logout
            - .profile
            - .zshrc
            - .zshenv
            - .zprofile
            - .zlogin
            - .config/starship.toml
            - .config/fish

    terminals:
        location: "$CONFIG_DIR"
        entries:
            - alacritty
            - kitty
            - wezterm
            - foot
            - ghostty
            - xfce4/terminal

    dev_tools:
        location: "$CONFIG_DIR"
        entries:
            - git
            - gh
            - glab
            - nvim
            - helix
            - micro
            - bat
            - ripgrep
            - fd
            - lazygit

    cli_tools:
        location: "$CONFIG_DIR"
        entries:
            - htop
            - btop
            - tmux
            - starship.toml
            - dconf

    # Tabby terminal settings. "traversal: files" only picks up the top-level
    # config files (config.yaml, window.json, …) and skips Electron caches.
    tabby:
        location: "$CONFIG_DIR/tabby"
        traversal: files
        exclude:
            - DIPS*
            - "Network Persistent State"
            - Preferences
            - "Trust Tokens*"
            - SharedStorage*
            - "Local State"
            - log.txt
            - "*.log"

    # SSH is available but unchecked by default so private keys are never
    # exported accidentally. Add finer-grained entries like ".ssh/config"
    # or ".ssh/known_hosts" to share only specific files.
    ssh:
        location: "$HOME/"
        entries:
            - .ssh

    # Here are a few examples of how you can add more stuff to back up.
    # Uncomment these lines if you want.
    # firefox:
    #     location: "$HOME/.mozilla/firefox/${ENDS_WITH='.default-release'}"
    #     entries:
    #         - chrome # for firefox customizations

    # code oss:
    #     location: "$CONFIG_DIR/Code - OSS/User/"
    #     entries:
    #         - settings.json


# The following files will only be used for exporting and importing.
export:
    share_folder:
        location: "$SHARE_DIR"
        entries:
            - plasma
            - kwin
            - konsole
            - fonts
            - color-schemes
            - aurorae
            - icons
            - wallpapers
            - yakuake
            - kactivitymanagerd
            - themes
            - emoji
            - ksplash

    home_folder:
        location: "$HOME/"
        entries:
            - .fonts
            - .themes
            - .icons
            - .local/share/fonts
            - .local/share/icons
            - .local/share/themes

    # You can add more files to export like this
    # name:
    #     location: "path/to/parent/directory"
    #     entries:
    #         - file1
    #         - file2
    #         - folder1
    #         - folder2
...
